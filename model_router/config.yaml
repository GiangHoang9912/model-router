# Model Router — Default Configuration
# =====================================
# Cài đặt: model-router init
# Xem:     model-router show
# Sửa:     model-router set <category> <model>
# URL:     model-router url <url>
# Reset:   model-router reset
# Models:  model-router list-models

# Provider info (dùng chung cho mọi route)
provider:
  name: custom:9router               # Tên provider trong Hermes config
  api_url: http://localhost:20128/v1  # API endpoint (9router / OpenRouter / ...)

routing:
  code: ag/claude-sonnet-4-6
